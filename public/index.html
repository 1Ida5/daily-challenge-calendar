<!doctype html>

<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title data-i18n="title">Daily Challenge</title>
    <link rel="stylesheet" href="app.css" />
    <link rel="manifest" href="/manifest.json" />
  </head>

  <body>
    <div class="auth-container">
      <h1 data-i18n="title">Daily Challenge</h1>

      <p id="auth-description" data-i18n="authDescription">
        Login or create your account
      </p>

      <div class="auth-tabs" role="tablist">
        <button
          id="loginTab"
          class="active"
          role="tab"
          aria-selected="true"
          aria-controls="auth-form"
          data-i18n="login"
        >
          Login
        </button>

        <button
          id="registerTab"
          role="tab"
          aria-selected="false"
          aria-controls="auth-form"
          data-i18n="register"
        >
          Register
        </button>
      </div>

      <form id="auth-form" aria-describedby="auth-description">
        <label for="username" data-i18n="username">Username</label>
        <input
          id="username"
          name="username"
          type="text"
          required
          autocomplete="username"
        />

        <label for="password" data-i18n="password">Password</label>
        <input
          id="password"
          name="password"
          type="password"
          required
          autocomplete="current-password"
        />

        <div id="tos-container" class="tos-container">
          <label class="tos-label">
            <input type="checkbox" id="tos" name="tos" />

            <span data-i18n="accept">I accept the</span>
            <a href="tos.html" target="_blank" rel="noopener" data-i18n="tos">
              Terms of Service
            </a>
            <span data-i18n="and">and</span>
            <a
              href="privacy.html"
              target="_blank"
              rel="noopener"
              data-i18n="privacy"
            >
              Privacy Policy
            </a>
          </label>
        </div>

        <button type="submit" id="submitBtn" data-i18n="login">Login</button>
      </form>

      <p id="error-msg" class="error" role="alert" aria-live="assertive"></p>
    </div>

    <script type="module" src="auth.mjs"></script>
  </body>
</html>
