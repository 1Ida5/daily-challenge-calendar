<!doctype html>

<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <title data-i18n="title">Daily Challenge</title>

    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <link rel="manifest" href="/manifest.json" />

    <link rel="stylesheet" href="./dashboard.css" />
  </head>

  <body>
    <header class="topbar">
      <h1 data-i18n="title">Daily Challenge</h1>

      <div class="calendar-nav">
        <button id="prevMonth">←</button>
        <span id="monthLabel"></span>
        <button id="nextMonth">→</button>
      </div>

      <nav aria-label="User menu">
        <span id="username"></span>

        <button id="logoutBtn" data-i18n="logout" aria-label="Logout">
          Logout
        </button>
      </nav>
    </header>

    <main class="dashboard-container">
      <section aria-labelledby="calendar-heading">
        <h2 id="calendar-heading" data-i18n="calendarTitle">
          Your Challenge Calendar
        </h2>

        <section class="challenge-form">
          <label for="challengeInput" data-i18n="newChallenge">
            New challenge
          </label>

          <input id="challengeInput" type="text" />

          <button id="addChallenge">Add challenge</button>
        </section>

        <div class="weekdays" id="weekdays"></div>
        <div id="calendar"></div>
      </section>
    </main>

    <script type="module" src="./dashboard.mjs"></script>
  </body>
</html>
