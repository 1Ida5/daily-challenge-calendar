<!doctype html>

<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <title data-i18n="title">Daily Challenge</title>

    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <link rel="manifest" href="/manifest.json" />

    <link rel="stylesheet" href="./css/dashboard.css" />
  </head>

  <body>
    <header class="topbar">
      <h1 data-i18n="title">Daily Challenge</h1>

      <div class="calendar-nav">
        <button id="prevMonth">←</button>
        <span id="monthLabel"></span>
        <button id="nextMonth">→</button>
      </div>

      <nav aria-label="User menu">
        <span id="username"></span>

        <button id="profileBtn" data-i18n="profile"></button>

        <button id="logoutBtn" data-i18n="logout" aria-label="Logout"></button>
      </nav>
    </header>

   <dialog id="profileDialog">
  <h3 data-i18n="profile"></h3>

  <p id="completedCount"></p>
  <p id="missedCount"></p>
  <p id="deletedCount"></p>

  <button id="closeProfile" data-i18n="close"></button>
</dialog>

    <dialog id="helpDialog">
  <h3 data-i18n="helpTitle"></h3>

  <ul>
    <li data-i18n="help1"></li>
    <li data-i18n="help2"></li>
    <li data-i18n="help3"></li>
    <li data-i18n="help4"></li>
    <li data-i18n="help5"></li>
  </ul>

  <button id="closeHelp" data-i18n="close"></button>
</dialog>
    </div>

    <main class="dashboard-container">
      <section aria-labelledby="calendar-heading">
        <h2 id="calendar-heading" data-i18n="calendarTitle"></h2>

        <section class="challenge-form">
          <label for="challengeInput" data-i18n="newChallenge"></label>

          <input id="challengeInput" type="text" />

          <button id="addChallenge" data-i18n="addChallenge"></button>

          <button id="helpBtn" data-i18n="help"></button>
        </section>

        <div class="weekdays" id="weekdays"></div>
        <div id="calendar"></div>
      </section>
    </main>

    <script type="module" src="./js/dashboard.js"></script>
  </body>
</html>
