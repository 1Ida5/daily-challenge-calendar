<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <title data-i18n="title">Daily Challenge</title>

    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <link rel="manifest" href="/manifest.json" />

    <link rel="stylesheet" href="./dashboard.css" />
  </head>

  <body>
    <header class="topbar">
      <h1 data-i18n="title">Daily Challenge</h1>

      <nav aria-label="User menu">
        <span id="username"></span>

        <button id="logoutBtn" data-i18n="logout" aria-label="Logout">
          Logout
        </button>
      </nav>
    </header>

    <main class="dashboard-container">
      <section aria-labelledby="calendar-heading">
        <h2 id="calendar-heading" data-i18n="calendarTitle">
          Your Challenge Calendar
        </h2>

        <!-- weekdays -->
        <div class="weekdays" id="weekdays" aria-hidden="true"></div>

        <div id="calendar" aria-label="Challenge calendar"></div>
      </section>

      <section class="challenge-form">
        <label for="challengeInput" data-i18n="newChallenge">
          New challenge
        </label>

        <input
          id="challengeInput"
          type="text"
          aria-describedby="challengeHelp"
        />

        <button
          id="addChallenge"
          data-i18n="addChallenge"
          aria-label="Add challenge"
        >
          Add challenge
        </button>
      </section>
    </main>

    <script type="module" src="./dashboard.mjs"></script>
  </body>
</html>
